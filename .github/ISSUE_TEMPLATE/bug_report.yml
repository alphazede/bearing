name: Bug report
description: Something in Bearing Lite behaved incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use the [private vulnerability form](https://github.com/alphazede/bearing-lite/security/advisories/new). Sanitize credentials, private paths, raw sessions, and proprietary data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the task, expected behavior, and observed Bearing Lite behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bearing Lite version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation source
      options:
        - npm package
        - GitHub repository
        - Agent Plugin marketplace
        - Source checkout
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic data and list the smallest reproducible steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include typed outcomes or logs only after removing secrets and private data.

