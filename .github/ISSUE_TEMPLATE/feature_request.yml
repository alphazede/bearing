name: Feature request
description: Propose a focused Bearing Lite capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        State the user problem first. Bearing Lite is deliberately skills-first and has no CLI, MCP server, browser control room, or hidden runtime state.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and where does the current plugin fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest observable outcome that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

