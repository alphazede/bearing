name: Bearing quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bearing-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test public Lite contract
        run: node --test test/*.test.mjs

      - name: Audit
        run: pnpm audit --audit-level=moderate

      - name: Check package contents
        run: |
          npm pack --dry-run --json > "${RUNNER_TEMP}/pack.json"
          PACK_JSON="${RUNNER_TEMP}/pack.json" node <<'NODE'
          const pack = require(process.env.PACK_JSON)[0];
          const pkg = require("./package.json");
          if (pack.name !== pkg.name || pack.version !== pkg.version) {
            throw new Error(`Unexpected package identity: ${pack.name}@${pack.version}`);
          }
          if (pack.entryCount !== pack.files.length || pack.files.length === 0) {
            throw new Error(`Invalid packed file count: ${pack.entryCount}/${pack.files.length}`);
          }
          NODE

      - name: Check whitespace
        run: git diff --check
