name: Publish Bearing Lite npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must match v<package version>)
        required: true
        type: string
      confirm:
        description: Type the exact package name and version to publish
        required: true
        type: string
      bootstrap_npm_token:
        description: Use NPM_TOKEN only for the first package publication
        required: true
        default: false
        type: boolean

permissions:
  checks: read
  contents: read
  id-token: write
  security-events: read

concurrency:
  group: bearing-lite-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm and npm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          npm install --global npm@11.15.0

      - name: Verify immutable release tag and confirmation
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          expected_confirmation="${package_name}@${package_version}"
          test "$REQUESTED_TAG" = "$expected_tag"
          test "$CONFIRMATION" = "$expected_confirmation"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${expected_tag}^{commit}")"

      - name: Verify main and required hosted checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$checked_out_sha" = "$main_sha"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/commits/${checked_out_sha}/check-runs?filter=latest&per_page=100" \
            > "${RUNNER_TEMP}/check-runs.json"
          CHECKS_FILE="${RUNNER_TEMP}/check-runs.json" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const pages = JSON.parse(readFileSync(process.env.CHECKS_FILE, "utf8"));
          const runs = pages.flatMap((page) => page.check_runs ?? []);
          for (const name of ["quality", "Semgrep scan", "Analyze (javascript-typescript)", "Analyze (actions)"]) {
            const latest = runs.filter((run) => run.name === name).sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
              throw new Error(`Required check is not successful: ${name}`);
            }
            console.log(`Verified ${name}: ${latest.html_url}`);
          }
          NODE
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=refs/heads/main&state=open&tool_name=CodeQL&per_page=100" \
            > "${RUNNER_TEMP}/codeql-alerts.json"
          ALERTS_FILE="${RUNNER_TEMP}/codeql-alerts.json" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const alerts = JSON.parse(readFileSync(process.env.ALERTS_FILE, "utf8")).flat();
          if (alerts.length) throw new Error(`CodeQL has ${alerts.length} open alert(s)`);
          NODE

      - name: Verify release candidate
        run: |
          pnpm install --frozen-lockfile
          node --test test/*.test.mjs
          pnpm audit --audit-level=moderate
          npm pack --dry-run --json

      - name: Publish first release with bootstrap token and provenance
        if: inputs.bootstrap_npm_token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish with trusted publishing
        if: ${{ !inputs.bootstrap_npm_token }}
        run: npm publish --access public

